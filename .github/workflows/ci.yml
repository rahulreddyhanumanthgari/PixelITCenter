name: CI

# Lint, type-check and build every pull request into develop or master
# (modernization plan, section 06: automated checks before merge).
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
